services:
  - type: web
    name: saferoute
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: VISION_API_KEY
        sync: false
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: OSRM_TIMEOUT_SECONDS
        value: "6.0"
      - key: ROUTE_HAZARD_BUFFER_METERS
        value: "25.0"
      - key: KUKATPALLY_FALLBACK_LAT
        value: "17.4849"
      - key: KUKATPALLY_FALLBACK_LNG
        value: "78.4138"
